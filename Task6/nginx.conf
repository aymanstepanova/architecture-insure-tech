http {
    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    # Rate limiting: не более 10 запросов в минуту на клиента (по IP).
    # Используем $binary_remote_addr для компактного ключа.
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/m;

    # Возвращать 429 при превышении лимита.
    limit_req_status 429;

    server {
        listen 80;

        location / {
            # Строго ограничиваем до 10 запросов/мин (burst=0).
            limit_req zone=req_limit_per_ip burst=0;

            proxy_pass http://backend_servers;
        }
    }
}

