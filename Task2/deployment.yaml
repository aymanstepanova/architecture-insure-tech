apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      volumes:
        # Для демонстрации HPA по памяти:
        # tmpfs-том, чтобы можно было создать реальную memory-нагрузку в поде.
        - name: ramdisk
          emptyDir:
            medium: Memory
      containers:
        - name: scaletestapp
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              # HPA Utilization (%) считается от requests.
              # Делаем requests ниже, чтобы при нагрузке достижим был порог 80%,
              # при этом лимит по заданию остаётся 30Mi.
              memory: 5Mi
            limits:
              memory: 30Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: memhog
          # Sidecar только для доказательства работы HPA по памяти.
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: MEM_MB
              value: "20"
          command:
            - sh
            - -c
            - >-
              echo "Allocating ${MEM_MB}Mi to tmpfs..." &&
              dd if=/dev/zero of=/ram/alloc bs=1M count=${MEM_MB} &&
              sleep 3600
          volumeMounts:
            - name: ramdisk
              mountPath: /ram
          resources:
            requests:
              memory: 1Mi
            limits:
              memory: 25Mi

