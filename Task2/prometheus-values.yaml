## Values для prometheus-community/kube-prometheus-stack
##
## Установка (PowerShell):
## helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
## helm repo update
## helm install monitoring prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f .\Task2\prometheus-values.yaml
##

prometheus:
  prometheusSpec:
    # Будем использовать ServiceMonitor, который добавим в Task2/servicemonitor.yaml.
    serviceMonitorSelectorNilUsesHelmValues: false

